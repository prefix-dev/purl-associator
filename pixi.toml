[workspace]
name = "purl-associator"
description = "Generate and edit PURL mappings for conda-forge packages"
authors = ["Wolf Vollprecht <hi@prefix.dev>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.13,<3.14"
py-rattler = ">=0.23.1,<0.24"
pyyaml = ">=6.0,<7"
typer = ">=0.25,<0.26"
httpx = ">=0.28,<0.29"
rich = ">=13"
anthropic = ">=0.88,<1"
packageurl-python = ">=0.17.6, <0.18"
cvss = ">=3.6,<4"

[feature.dev.dependencies]
ruff = "*"

# Minimal environment for the merge + validate steps (pure stdlib + jsonschema).
# Lets the Pages deploy run the pixi tasks without installing py-rattler.
[feature.lite.dependencies]
python = ">=3.13,<3.14"
jsonschema = ">=4.20,<5"

# The merge/validate tasks live on the `lite` feature. Both the `default`
# and `lite` environments include it, so the tasks are defined exactly once
# (no ambiguity) yet runnable without installing py-rattler.
[feature.lite.tasks]
merge = "python -m scripts.merge_mappings"
merge-cves = "python -m scripts.merge_cves"
merge-sboms = "python -m scripts.merge_sboms"
validate = "python -m scripts.validate"

[environments]
default = ["lite"]
dev = ["dev"]
lite = { features = ["lite"], no-default-feature = true }

[tasks]
automap = "python -m scripts.automap"
top-downloads = "python -m scripts.top_downloads"
hydrate-downloads = "python -m scripts.hydrate_downloads"
merge = "python -m scripts.merge_mappings"
download-counts-refresh = { cmd = "python -m scripts.hydrate_downloads --concurrency {{ concurrency }} --channel {{ channel }} && python -m scripts.merge_mappings", description = "Refresh prefix.dev download counts locally and rebuild the frontend mappings payload", args = [{ arg = "concurrency", default = "16" }, { arg = "channel", default = "conda-forge" }] }
ai-vet = "python -m scripts.ai_vet"
osv-fetch = "python -m scripts.osv_fetch"
nvd-fetch = "python -m scripts.nvd_fetch"
cve-match = "python -m scripts.cve_match"
sbom-extract = "python -m scripts.sbom_extract"
nvd-cve-match = "python -m scripts.nvd_prototype"
sbom-cve-match = "python -m scripts.sbom_cve_match"
merge-sboms = "python -m scripts.merge_sboms"
cpe-discover = "python -m scripts.cpe_discover"
cpe-vet = "python -m scripts.cpe_vet"
cpe-promote = "python -m scripts.cpe_promote"
lint = { cmd = "ruff check scripts && ruff format --check scripts", env = {} }
fmt = "ruff format scripts"

[tasks.automap-test]
cmd = "python -m scripts.automap --only {{ packages }} --out {{ auto }} --parallel {{ parallel }} --force && python -m scripts.merge_mappings --auto {{ auto }} --out {{ out }}"
description = "Test auto-association on a small package set without touching committed outputs"
args = [
  { arg = "packages", default = "numpy,ripgrep,pandas" },
  { arg = "auto", default = ".tmp/auto-test.json" },
  { arg = "out", default = ".tmp/mappings-test.json" },
  { arg = "parallel", default = "8" },
]

# GitHub Actions helpers. Requires `gh auth login` first.
[tasks.gh-workflows]
cmd = "gh workflow list"
description = "List GitHub Actions workflows"

[tasks.gh-runs]
cmd = "gh run list --limit {{ limit }}"
description = "List recent GitHub Actions runs"
args = [
  { arg = "limit", default = "10" },
]

[tasks.gh-watch]
cmd = "gh run watch {{ run }}"
description = "Watch a GitHub Actions run by run id"
args = [
  { arg = "run" },
]

[tasks.gh-automap]
cmd = "gh workflow run automap.yml --ref {{ ref }} -f limit='{{ limit }}' -f only='{{ only }}' -f force='{{ force }}'"
description = "Trigger the Automatic PURL mapping workflow"
args = [
  { arg = "only", default = "" },
  { arg = "limit", default = "" },
  { arg = "force", default = "false" },
  { arg = "ref", default = "main" },
]

[tasks.gh-automap-force]
cmd = "gh workflow run automap.yml --ref {{ ref }} -f limit='{{ limit }}' -f only='{{ only }}' -f force=true"
description = "Trigger a forced Automatic PURL mapping workflow run"
args = [
  { arg = "only", default = "" },
  { arg = "limit", default = "" },
  { arg = "ref", default = "main" },
]

[tasks.gh-cve-refresh]
cmd = "gh workflow run cve_refresh.yml --ref {{ ref }} -f only='{{ only }}' -f limit='{{ limit }}' -f force_osv='{{ force_osv }}'"
description = "Trigger the Refresh CVE assignments workflow"
args = [
  { arg = "only", default = "" },
  { arg = "limit", default = "" },
  { arg = "force_osv", default = "false" },
  { arg = "ref", default = "main" },
]

[tasks.gh-sbom-refresh]
cmd = "gh workflow run sbom_refresh.yml --ref {{ ref }} -f only='{{ only }}' -f refresh_automap='{{ refresh_automap }}' -f automap_top_downloads='{{ automap_top_downloads }}' -f force_osv='{{ force_osv }}' -f parallel='{{ parallel }}'"
description = "Trigger the embedded SBOM inspection refresh workflow (default: all conda-forge)"
args = [
  { arg = "only", default = "" },
  { arg = "refresh_automap", default = "true" },
  { arg = "automap_top_downloads", default = "" },
  { arg = "force_osv", default = "false" },
  { arg = "parallel", default = "8" },
  { arg = "ref", default = "main" },
]

[tasks.gh-pages]
cmd = "gh workflow run pages.yml --ref {{ ref }}"
description = "Trigger the GitHub Pages deployment workflow"
args = [
  { arg = "ref", default = "main" },
]

[tasks.gh-download-counts]
cmd = "gh workflow run download_counts.yml --ref {{ ref }} -f concurrency='{{ concurrency }}' -f channel='{{ channel }}'"
description = "Trigger the weekly download-count refresh workflow"
args = [
  { arg = "ref", default = "main" },
  { arg = "concurrency", default = "16" },
  { arg = "channel", default = "conda-forge" },
]

[tasks.gh-ai-vet]
cmd = "gh workflow run ai_vet.yml --ref {{ ref }} -f mode='{{ mode }}' -f limit='{{ limit }}' -f skip_vetted='{{ skip_vetted }}' -f only='{{ only }}' -f ai_batch_size='{{ ai_batch_size }}' -f commit_every='{{ commit_every }}'"
description = "Trigger the AI vet PURL mappings workflow"
args = [
  { arg = "ref", default = "main" },
  { arg = "mode", default = "realtime" },
  { arg = "limit", default = "200" },
  { arg = "skip_vetted", default = "true" },
  { arg = "only", default = "" },
  { arg = "ai_batch_size", default = "15" },
  { arg = "commit_every", default = "16" },
]

[tasks.gh-cpe-discover]
cmd = "gh workflow run cpe_discover.yml --ref {{ ref }} -f top='{{ top }}' -f only='{{ only }}' -f skip_vet='{{ skip_vet }}'"
description = "Trigger the CPE discovery workflow"
args = [
  { arg = "ref", default = "main" },
  { arg = "top", default = "100" },
  { arg = "only", default = "" },
  { arg = "skip_vet", default = "false" },
]

# Local app/Worker helpers.
[tasks.install]
depends-on = ["web-install", "worker-install"]
description = "Install web and Worker npm dependencies"

[tasks.check-local]
depends-on = ["validate", "web-build", "worker-typecheck"]
description = "Validate data, build the web app, and typecheck the Worker"

[tasks.web-install]
cmd = "npm install"
cwd = "web"
description = "Install frontend npm dependencies"

[tasks.web-dev]
cmd = "npm run dev -- --host {{ host }} --port {{ port }}"
cwd = "web"
depends-on = ["web-install"]
description = "Run the frontend Vite dev server"
args = [
  { arg = "host", default = "127.0.0.1" },
  { arg = "port", default = "5173" },
]

[tasks.web-build]
cmd = "npm run build"
cwd = "web"
depends-on = ["web-install"]
description = "Build the frontend"

[tasks.web-preview]
cmd = "npm run preview -- --host {{ host }} --port {{ port }}"
cwd = "web"
depends-on = ["web-build"]
description = "Serve the built frontend locally"
args = [
  { arg = "host", default = "127.0.0.1" },
  { arg = "port", default = "4173" },
]

[tasks.worker-install]
cmd = "npm install"
cwd = "worker"
description = "Install Worker npm dependencies"

[tasks.worker-dev]
cmd = "npm run dev -- --port {{ port }}"
cwd = "worker"
depends-on = ["worker-install"]
description = "Run the Cloudflare Worker locally with Wrangler"
args = [
  { arg = "port", default = "8787" },
]

[tasks.worker-typecheck]
cmd = "npm run typecheck"
cwd = "worker"
depends-on = ["worker-install"]
description = "Typecheck the Cloudflare Worker"
