name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "mappings/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: latest
          cache: true
          environments: lite

      - name: Refresh served mappings.json (auto + manual + contributions)
        run: pixi run -e lite merge

      - name: Refresh served split CVE dashboard payload (index + package details)
        run: pixi run -e lite merge-cves

      - name: Refresh served cve_ai_drafts.json + cve_ai_queue.json sidecars
        run: pixi run -e lite merge-ai-drafts
      - name: Refresh served SBOM inspection data
        run: pixi run -e lite merge-sboms

      - name: Validate CVE data against the OSV + OpenVEX schemas
        run: pixi run -e lite validate

      - name: Install web deps
        working-directory: web
        run: npm ci || npm install

      - name: Build
        working-directory: web
        env:
          VITE_REPO_OWNER: ${{ github.repository_owner }}
          VITE_REPO_NAME: ${{ github.event.repository.name }}
          VITE_REPO_BRANCH: ${{ github.event.repository.default_branch }}
          VITE_OAUTH_WORKER_URL: ${{ vars.OAUTH_WORKER_URL }}
          VITE_GITHUB_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
