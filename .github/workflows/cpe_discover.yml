name: Discover CPE mappings

on:
  workflow_dispatch:
    inputs:
      top:
        description: "Top-N most-downloaded packages to consider (blank = all packages, no cap)"
        required: false
        default: ""
      only:
        description: "Comma-separated package names (blank = all)"
        required: false
        default: ""
      skip_vet:
        description: "Skip the AI vet step (heuristics only)"
        required: false
        default: "false"
        type: boolean
  schedule:
    # Weekly, Mondays at 06:13 UTC. Off the hour to avoid the cron rush,
    # staggered from automap (03:17 daily).
    - cron: "13 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cpe-discover
  cancel-in-progress: false

jobs:
  cpe-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: latest
          cache: true

      - name: Run heuristic discovery
        run: |
          set -euo pipefail
          # No --top on the scheduled run → cpe_discover's default (0 = no
          # cap) considers every package. A manual dispatch can still pass a
          # numeric ``top`` input to bound a one-off run.
          ARGS=()
          if [ -n "${{ inputs.top }}" ]; then ARGS+=(--top "${{ inputs.top }}"); fi
          if [ -n "${{ inputs.only }}" ]; then ARGS+=(--only "${{ inputs.only }}"); fi
          pixi run cpe:discover "${ARGS[@]}"

      - name: AI tiebreaker for ambiguous bucket
        id: vet
        if: ${{ inputs.skip_vet != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # Fixed _workflow.json output path is safe only because the
          # ``concurrency: cpe-discover`` group above serializes runs. Two
          # parallel runs would race on this file — keep the concurrency
          # group in place if you change anything here.
          ARGS=(--out mappings/cpe_vet/_workflow.json)
          if [ -n "${{ inputs.only }}" ]; then ARGS+=(--only "${{ inputs.only }}"); fi
          # cpe_vet exits cleanly with "nothing to do" when the ambiguous
          # bucket is empty; record whether a fresh file was actually
          # written so the promote step can avoid stale-file reuse.
          rm -f mappings/cpe_vet/_workflow.json
          pixi run cpe:vet "${ARGS[@]}"
          if [ -f mappings/cpe_vet/_workflow.json ]; then
            echo "vet_file=mappings/cpe_vet/_workflow.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote accepts (+ confident AI verdicts) to a contribution
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ inputs.skip_vet }}" = "true" ]; then
            ARGS+=(--no-vet)
          elif [ -n "${{ steps.vet.outputs.vet_file || '' }}" ]; then
            # Belt-and-braces: pin the vet file produced by this run, so
            # cpe_promote can't accidentally reuse a tracked vet file from
            # a prior discover/vet run.
            ARGS+=(--vet-file "${{ steps.vet.outputs.vet_file }}")
          else
            # No fresh vet file this run; explicitly skip the AI layer so
            # we don't fall back to a tracked stale one.
            ARGS+=(--no-vet)
          fi
          pixi run cpe:promote "${ARGS[@]}"

      - name: Merge mappings for the SPA
        # Confirms the new contribution flows through merge_mappings cleanly.
        # The output (web/public/mappings.json) is gitignored — pages.yml
        # regenerates it on deploy.
        run: pixi run -e lite mappings:merge

      - name: Generate PR body
        # Reconstructs the promoted set (accepts + confident AI verdicts) the
        # same way cpe_promote does, so the PR description leads with the net
        # effect — which CPEs land on mappings.json after merge — instead of a
        # static "review the diff" blurb. Mirror the vet-file resolution used
        # by the promote step so the vet table reflects this run only.
        run: |
          set -euo pipefail
          ARGS=(--candidates mappings/cpe_candidates/latest.json)
          if [ "${{ inputs.skip_vet }}" != "true" ] \
             && [ -n "${{ steps.vet.outputs.vet_file || '' }}" ]; then
            ARGS+=(--vet "${{ steps.vet.outputs.vet_file }}")
          fi
          pixi run python -m scripts.cpe_summary "${ARGS[@]}" \
            > /tmp/cpe_pr_body.md
          echo "----- PR body preview -----"
          cat /tmp/cpe_pr_body.md

      - name: Open / update PR
        uses: peter-evans/create-pull-request@v8
        with:
          # Audit artifacts (candidates + vet) and the shipping contribution.
          # web/public/mappings.json is gitignored so won't be added even if
          # it appears in the workspace.
          add-paths: |
            mappings/cpe_candidates/**
            mappings/cpe_vet/**
            mappings/contributions/*--cpe-pipeline--*.json
          branch: cpe-pipeline/refresh
          base: main
          title: "cpe: refresh CPE mappings (automated)"
          commit-message: "cpe: refresh CPE mappings"
          delete-branch: true
          body-path: /tmp/cpe_pr_body.md
