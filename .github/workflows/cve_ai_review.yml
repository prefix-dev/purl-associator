name: AI CVE coverage review

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "API mode (realtime = fast/dispatch, batches = cheap/scheduled, claude-cli not supported in CI)"
        required: false
        default: "realtime"
        type: choice
        options:
          - realtime
          - batches
      limit:
        description: "Cap queue items processed this run"
        required: false
        default: "50"
      only:
        description: "Comma-separated package filter (blank = all queued)"
        required: false
        default: ""
      redraft:
        description: "Force re-drafting even when severity hasn't changed"
        required: false
        default: "false"
        type: boolean
      ai_batch_size:
        description: "Max advisories per Claude call within a package"
        required: false
        default: "3"
      commit_every:
        description: "git push every N packages (0 = only at end)"
        required: false
        default: "8"
  schedule:
    # Twice daily so UI-queued advisories are reviewed within ~12h.
    # 08:17 and 20:17 UTC — staggered from cve_refresh (04:37) and ai_vet (Mon 04:23).
    - cron: "17 8,20 * * *"

permissions:
  contents: write
  pull-requests: write

# Separate group from cve-refresh — the two workflows write to different
# directories and the -X theirs merge dance handles any overlap.
concurrency:
  group: cve-ai-review
  cancel-in-progress: false

jobs:
  cve-ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: latest
          cache: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Switch to cve-ai-review/refresh branch
        run: |
          set -euo pipefail
          # Always run with main's latest code, but preserve drafts accumulated
          # on cve-ai-review/refresh from prior runs. Drafts are append-only so
          # main's mappings/cves/ updates flow in cleanly with -X theirs.
          if git ls-remote --exit-code --heads origin cve-ai-review/refresh >/dev/null 2>&1; then
            echo "Branch exists — checking out and merging main"
            git checkout -B cve-ai-review/refresh origin/cve-ai-review/refresh
            git merge origin/main --no-edit -X theirs
          else
            echo "Creating branch from main"
            git checkout -B cve-ai-review/refresh origin/main
            git push -u origin cve-ai-review/refresh
          fi

      - name: Run AI CVE review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode || 'realtime' }}"
          LIMIT="${{ inputs.limit || '50' }}"
          ONLY="${{ inputs.only }}"
          REDRAFT="${{ inputs.redraft == 'true' && 'true' || 'false' }}"
          AI_BATCH_SIZE="${{ inputs.ai_batch_size || '3' }}"
          COMMIT_EVERY="${{ inputs.commit_every || '8' }}"

          ARGS=(--backend api --mode "$MODE" --ai-batch-size "$AI_BATCH_SIZE" --commit-every "$COMMIT_EVERY")
          if [ -n "$LIMIT" ]; then ARGS+=(--limit "$LIMIT"); fi
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$REDRAFT" = "true" ]; then ARGS+=(--redraft); fi

          pixi run cve-ai-review "${ARGS[@]}"

      - name: Generate PR body
        run: |
          mkdir -p .tmp
          pixi run cve-ai-summary --since-ref origin/main --out .tmp/ai-pr-body.md
          echo "---"
          head -40 .tmp/ai-pr-body.md || true

      - name: Commit draft files
        run: |
          set -euo pipefail
          git add mappings/cve_ai_drafts/ || true
          if ! git diff --cached --quiet; then
            git commit -m "cve-ai-review: refresh drafts"
            git push
          else
            echo "No draft changes to commit."
          fi

      - name: Open PR if not already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OPEN_PR=$(gh pr list --state open --head cve-ai-review/refresh --json number -q '.[].number' | head -n1)
          if [ -n "$OPEN_PR" ]; then
            echo "PR #$OPEN_PR already open — updating body and letting branch updates flow into it."
            gh pr edit "$OPEN_PR" --body-file .tmp/ai-pr-body.md
          else
            gh pr create \
              --base main \
              --head cve-ai-review/refresh \
              --title "AI CVE review drafts" \
              --body-file .tmp/ai-pr-body.md
          fi
