name: Automatic PURL mapping

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Limit packages processed (blank = all)"
        required: false
        default: ""
      only:
        description: "Comma-separated package names (blank = all)"
        required: false
        default: ""
      force:
        description: "Re-process even when (version, build) matches the cached entry"
        required: false
        default: "false"
        type: boolean
  schedule:
    # Every 24 hours at 03:17 UTC. Off the hour to avoid the cron rush.
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automap
  cancel-in-progress: false

jobs:
  automap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: latest
          cache: true

      - name: Snapshot baseline auto.json
        # Capture HEAD's mappings before automap rewrites the file so the
        # summary step can diff against it.
        run: |
          mkdir -p /tmp/automap_baseline
          git show HEAD:mappings/auto.json > /tmp/automap_baseline/auto.json 2>/dev/null \
            || echo '{"packages":{}}' > /tmp/automap_baseline/auto.json

      - name: Run automap
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${{ inputs.limit }}" ]; then ARGS+=(--limit "${{ inputs.limit }}"); fi
          if [ -n "${{ inputs.only }}" ]; then ARGS+=(--only "${{ inputs.only }}"); fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          pixi run purl:automap "${ARGS[@]}"

      - name: Merge mappings for the SPA
        run: pixi run mappings:merge

      - name: Generate PR body
        run: |
          pixi run python -m scripts.automap_summary \
            --before /tmp/automap_baseline/auto.json \
            --after mappings/auto.json \
            > /tmp/automap_pr_body.md
          echo "----- PR body preview -----"
          cat /tmp/automap_pr_body.md

      - name: Mint pipeline bot token
        # PRs created with the default GITHUB_TOKEN can't trigger the
        # validate workflow (GitHub's recursion guard), so the required check
        # would never report and auto-merge would never fire. Mint a
        # short-lived token from the org-owned pipeline GitHub App instead.
        # The step is skipped when the app isn't configured yet; the token
        # fallback chain below then degrades to a PIPELINE_PAT secret and
        # finally to GITHUB_TOKEN, where the PR just waits for a manual merge.
        id: app-token
        if: vars.PIPELINE_APP_ID
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

      - name: Open / update PR if mappings changed
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || secrets.PIPELINE_PAT || github.token }}
          add-paths: |
            mappings/auto.json
            web/public/mappings.json
            web/public/mappings-index.json
            web/public/mapping_packages/**
          branch: automap/refresh
          base: main
          title: "automap: refresh PURL mappings"
          body-path: /tmp/automap_pr_body.md
          commit-message: "automap: refresh PURL mappings"
          delete-branch: true

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          # Same token as above: a merge performed by auto-merge enabled with
          # GITHUB_TOKEN would not trigger the pages deploy on main.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_PAT || github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          # Idempotent: when create-pull-request updates an existing PR the
          # earlier auto-merge request is still active, and enabling it twice
          # errors.
          if [ -z "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest // empty')" ]; then
            gh pr merge --auto --squash "$PR"
          fi
